# Sized for the machine this is actually built on: 4 cores, 7 GB of RAM.
#
# The default here was -Xmx8G with a 4 GB metaspace, which asks for more heap
# than the machine has. The release build died five minutes in with
# "Native memory allocation (mmap) failed to map 1979711488 bytes for G1
# virtual space" — the JVM could not grow the heap and took the daemon with it.
#
# 2 GB is comfortable for this project (a Flutter app with a handful of
# plugins); raise it if a build ever genuinely runs out, but never above about
# half the physical RAM, because the Kotlin daemon, Dart, the Android build
# tools and Windows itself all need their share at the same time.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compile daemon is a second JVM. Left unset it takes its own
# generous default on top of everything above.
kotlin.daemon.jvmargs=-Xmx1G

# Four cores, but two workers leaves room for the Dart and Kotlin daemons.
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true
